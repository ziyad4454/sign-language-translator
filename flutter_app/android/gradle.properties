org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# The project folder's path has non-ASCII letters (the Arabic name of the Desktop
# folder), which the Android Gradle plugin refuses on Windows unless this check is off.
android.overridePathCheck=true
# Gradle can't load its wrapper from that path either, so builds run through a
# temporary drive letter (subst T: <project>). That puts the project and the pub
# cache on different drives, which breaks Kotlin's incremental compilation.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
